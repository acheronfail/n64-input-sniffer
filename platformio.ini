; PlatformIO project configuration
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library locations
;   Advanced options: extra scripting
;
; See the documentation for other options and examples:
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Without a default environment, `platformio run` can build all environments.
; Use the USB target for uploads unless `-e` explicitly selects another target.
default_envs = esp32-s3-devkitc-1

; All environments below inherit these shared settings.
[env]
extra_scripts = pre:scripts/build_web.py
; Keep Arduino 2.x / ESP-IDF 4.x for the sniffer's legacy RMT driver.
platform = platformio/espressif32@6.11.0
framework = arduino

; Keep the CPU at full speed. The bit-bang timing assumes 240 MHz.
board_build.f_cpu = 240000000L

; AsyncTCP stability tuning for sustained websocket traffic.
build_flags =
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=128
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=10000
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D WS_MAX_QUEUED_MESSAGES=64

; Asynchronous HTTP and WebSocket server for the UI and button state updates.
; Actively maintained ESP32Async forks.
lib_deps =
  https://github.com/ESP32Async/AsyncTCP.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  ; Captive setup portal for WiFi credentials (no fixed SSID/password).
  https://github.com/tzapu/WiFiManager.git

; Decode crash backtraces (register dumps -> function names + line numbers) in the serial monitor.
monitor_filters = esp32_exception_decoder

; All esp32-s3-* environments use these shared S3 flags.
; A flag added here also applies to the debug and OTA variants.
; (PlatformIO custom sections are interpolated as ${s3_flags.key}.)
[s3_flags]
build_flags =
  ${env.build_flags}
  ; Route Serial to the USB CDC port (the only connector on the Super Mini).
  ; Without this, Serial maps to UART0 hardware pins and produces no output.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Onboard WS2812 RGB LED on the Super Mini.
  -D POWER_LED_PIN=48

[env:esp32-s3-devkitc-1]
; esp32-s3-devkitc-1 matches the Super Mini: no PSRAM, 4 MB flash.
; lolin_s3_mini was incorrect. It enables PSRAM, which the Super Mini lacks.
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = ${s3_flags.build_flags}

[env:esp32dev]
board = esp32dev

; Wireless firmware upload requires an initial USB upload and a WiFi connection.
; These start the ArduinoOTA listener. For later uploads, run:
;   pio run -e esp32-s3-devkitc-1_ota -t upload
; Inherits all esp32-s3-devkitc-1 settings and changes the uploader to network OTA.
[env:esp32-s3-devkitc-1_ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
; The device advertises this mDNS name (OTA_HOSTNAME in main.cpp).
; If .local discovery fails on your network, use the IP address.
upload_port = n64spy.local
; If you set OTA_PASSWORD in main.cpp, uncomment and match it here:
; upload_flags = --auth=your-password-here

; Debug build: same as esp32-s3-devkitc-1, with a periodic "loop alive" heartbeat.
; The heartbeat shows that the sniffer runs even without a console. Flash with:
;   pio run -e esp32-s3-devkitc-1_debug -t upload
; Do a clean build after flag changes: pio run -e esp32-s3-devkitc-1_debug -t clean
[env:esp32-s3-devkitc-1_debug]
extends = env:esp32-s3-devkitc-1
; build_type = debug adds -g so esp32_exception_decoder can resolve crash
; backtraces to file names and line numbers instead of raw addresses.
build_type = debug
; Use the direct filter to show all raw device bytes immediately.
; The exception decoder does not buffer or transform these bytes.
monitor_filters = direct
build_flags =
  ${s3_flags.build_flags}
  -D DEBUG_HEARTBEAT

; Wireless firmware upload requires an initial USB upload and a WiFi connection.
; These start the ArduinoOTA listener. For later uploads, run:
;   pio run -e esp32dev_ota -t upload
; Inherits all esp32dev settings and changes the uploader to network OTA.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
; The device advertises this mDNS name (OTA_HOSTNAME in main.cpp).
; If .local discovery fails on your network, use the IP address.
upload_port = n64spy.local
; If you set OTA_PASSWORD in main.cpp, uncomment and match it here:
; upload_flags = --auth=your-password-here

; Debug build: same as esp32dev, with a periodic "loop alive" heartbeat.
; The heartbeat shows that the sniffer runs even without a console. Flash with:
;   pio run -e esp32dev_debug -t upload
[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
  ${env.build_flags}
  -D DEBUG_HEARTBEAT
