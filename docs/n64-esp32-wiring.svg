<svg xmlns="http://www.w3.org/2000/svg" width="462" height="319" viewBox="0 0 462 319" role="img" aria-labelledby="title desc">
  <title id="title">N64 to ESP32-S3 Super Mini wiring</title>
  <desc id="desc">Component side, USB-C up. Port 1 ground and 3.3 V connect to GND and 3V3. A 100 µF capacitor bridges those pins, positive to 3V3. Connect DATA from ports 1, 2, 3, and 4 to GPIO 13, 12, 11, and 10 respectively. The dashed wires for ports 3 and 4 are only used in the four-port enclosure. Leave 5V open.</desc>

  <rect x="1" y="1" width="460" height="317" rx="12" fill="#f7f9fc" stroke="#d5dce8"/>

  <rect x="16" y="39" width="188" height="243" rx="3" fill="#283444"/>
  <rect x="63" y="17" width="94" height="78" rx="5" fill="#dee5ef" stroke="#9ba9bc"/>
  <path d="M68 24H152 M68 29H152" stroke="#a9b5c5"/>

  <g fill="#bfc9d6" stroke="#78869a">
    <rect x="53" y="109" width="24" height="28" rx="2"/>
    <rect x="140" y="109" width="24" height="28" rx="2"/>
  </g>
  <g fill="#485364">
    <circle cx="65" cy="123" r="7"/>
    <circle cx="152" cy="123" r="7"/>
  </g>

  <path d="M110 144 L159 193 L110 242 L61 193 Z" fill="#161f2b" stroke="#627187"/>
  <rect x="154" y="223" width="14" height="13" rx="2" fill="#e0dfce" stroke="#8f9186"/>
  <rect x="49" y="257" width="57" height="16" rx="2" fill="#b64646" stroke="#e0a5a1"/>
  <path d="M56 261H66V269H76V261H86V269H99" fill="none" stroke="#eab8b2" stroke-width="1.5"/>

  <g fill="none" stroke-width="2.5">
    <path d="M191 83H329 M236 83V92 M228 92H244" stroke="#53647e"/>
    <path d="M191 109H329 M236 100V109 M228 100H244" stroke="#b62e46"/>
    <path d="M191 135H329 M191 161H329" stroke="#1d67aa"/>
    <g stroke="#1d67aa" stroke-dasharray="6 4">
      <path d="M191 187H329"/>
      <path d="M191 213H329"/>
      <path d="M222 247H249"/>
    </g>
  </g>
  <circle cx="236" cy="83" r="3" fill="#53647e"/>
  <circle cx="236" cy="109" r="3" fill="#b62e46"/>

  <g fill="#17202e" stroke="#eac374" stroke-width="2.5">
    <circle cx="29" cy="57" r="4.5"/><circle cx="191" cy="57" r="4.5"/>
    <circle cx="29" cy="83" r="4.5"/><circle cx="191" cy="83" r="4.5"/>
    <circle cx="29" cy="109" r="4.5"/><circle cx="191" cy="109" r="4.5"/>
    <circle cx="29" cy="135" r="4.5"/><circle cx="191" cy="135" r="4.5"/>
    <circle cx="29" cy="161" r="4.5"/><circle cx="191" cy="161" r="4.5"/>
    <circle cx="29" cy="187" r="4.5"/><circle cx="191" cy="187" r="4.5"/>
    <circle cx="29" cy="213" r="4.5"/><circle cx="191" cy="213" r="4.5"/>
    <circle cx="29" cy="239" r="4.5"/><circle cx="191" cy="239" r="4.5"/>
    <circle cx="29" cy="265" r="4.5"/><circle cx="191" cy="265" r="4.5"/>
  </g>

  <g font-family="DejaVu Sans, sans-serif" fill="#24354f" font-size="13">
    <g text-anchor="middle">
      <text x="110" y="61" font-weight="bold">USB-C</text>
      <text x="110" y="197" fill="#b9c6d7" font-size="11">ESP32-S3</text>
      <text x="110" y="304" font-weight="bold">ESP32-S3 Super Mini</text>
    </g>
    <g font-size="9" fill="#cdd6e1" text-anchor="middle">
      <text x="65" y="150">BOOT</text>
      <text x="152" y="150">RESET</text>
    </g>
    <g font-size="10" fill="#cdd6e1">
      <text x="40" y="61">TX</text>
      <text x="40" y="87">RX</text>
      <text x="40" y="113">1</text>
      <text x="40" y="139">2</text>
      <text x="40" y="165">3</text>
      <text x="40" y="191">4</text>
      <text x="40" y="217">5</text>
      <text x="40" y="243">6</text>
      <text x="40" y="269">7</text>
    </g>
    <g fill="#fff" font-size="11" text-anchor="end">
      <text x="181" y="61" fill="#cdd6e1">5V</text>
      <text x="181" y="87">GND</text>
      <text x="181" y="113">3V3</text>
      <text x="181" y="139">13</text>
      <text x="181" y="165">12</text>
      <text x="181" y="191">11</text>
      <text x="181" y="217">10</text>
      <text x="181" y="243" fill="#cdd6e1">9</text>
      <text x="181" y="269" fill="#cdd6e1">8</text>
    </g>

    <text x="248" y="105" fill="#b62e46" font-weight="bold">+</text>
    <text x="264" y="101">100 µF</text>
    <text x="341" y="87">Port 1 GND</text>
    <text x="341" y="113">Port 1 3.3 V</text>
    <text x="341" y="139">Port 1 DATA</text>
    <text x="341" y="165">Port 2 DATA</text>
    <text x="341" y="191">Port 3 DATA</text>
    <text x="341" y="217">Port 4 DATA</text>
    <text x="257" y="251" font-size="12">Four-port enclosure only</text>
  </g>
</svg>
