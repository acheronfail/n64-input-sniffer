<text x="1125" y="875" font-size="24" fill="#15243b" font-weight="bold" text-anchor="start">GND</text>
<text x="885" y="870" font-size="18" fill="#526078" font-weight="normal" text-anchor="start">Common ground</text>
<rect x="50" y="955" width="1490" height="200" rx="12" fill="white" stroke="#dce2eb"/>
<text x="75" y="991" font-size="19" fill="#15243b" font-weight="bold" text-anchor="start">POWER &amp; CONNECTION NOTES</text>
<text x="75" y="1028" font-size="21" fill="#15243b" font-weight="normal" text-anchor="start">Tap one console port’s 3.3V rail → ESP 3V3 (port 1 shown). All controller passthroughs stay connected.</text>
<text x="75" y="1063" font-size="21" fill="#15243b" font-weight="normal" text-anchor="start">Join all grounds to ESP GND. Capacitor: + to 3V3, − (striped side) to GND; keep leads short.</text>
<text x="75" y="1098" font-size="21" fill="#15243b" font-weight="normal" text-anchor="start">Keep the four DATA lines separate. DATA is the middle contact; verify power/GND orientation.</text>
<text x="75" y="1133" font-size="21" fill="#15243b" font-weight="normal" text-anchor="start">470 µF is the reported test value. Use a ≥ 6.3V capacitor. Console must be powered on and polling.</text>
<text x="60" y="1190" font-size="18" fill="#526078" font-weight="normal" text-anchor="start">● = electrical junction. Crossings without a dot do not connect. Wire colors indicate function, not cable insulation.</text>
</svg>