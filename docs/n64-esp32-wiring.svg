<text x="75" y="1009" font-size="19" fill="#15243b" font-weight="bold" text-anchor="start">POWER &amp; CONNECTION NOTES</text>
<text x="75" y="1042" font-size="20" fill="#15243b" font-weight="normal" text-anchor="start">Port 1 supplies ESP 3V3 and GND. Preserve every controller passthrough; keep the four DATA lines separate.</text>
<text x="75" y="1074" font-size="20" fill="#15243b" font-weight="normal" text-anchor="start">One ground tap is enough: all four port grounds already connect inside the same N64 console.</text>
<text x="75" y="1106" font-size="20" fill="#15243b" font-weight="normal" text-anchor="start">Place the 470 µF capacitor close to ESP power pins. Positive to 3V3; negative (striped side) to GND.</text>
<text x="75" y="1138" font-size="20" fill="#15243b" font-weight="normal" text-anchor="start">Controller terminals are schematic: DATA is the middle contact; verify power/GND orientation before wiring.</text>
<text x="60" y="1190" font-size="18" fill="#526078" font-weight="normal" text-anchor="start">● = electrical junction. Crossings without a dot do not connect. Wire colors indicate function, not cable insulation.</text>
</g></svg>