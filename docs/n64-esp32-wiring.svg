<text x="1285" y="653" font-size="18" fill="#15243b" font-weight="normal" text-anchor="start">≥ 6.3V electrolytic</text>
<text x="1285" y="681" font-size="18" fill="#15243b" font-weight="normal" text-anchor="start">Place close to ESP</text>
<text x="1310" y="827" font-size="18" fill="#15243b" font-weight="normal" text-anchor="start">5V pin: leave open</text>
<text x="1310" y="733" font-size="17" fill="#526078" font-weight="normal" text-anchor="start">Selected pins only.</text>
